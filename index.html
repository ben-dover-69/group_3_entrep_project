<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multipurpose Letter</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&family=Quicksand&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #800020;
  font-family: 'Quicksand', sans-serif;
  transition: 0.4s;
}

h1 { text-align: center; color: white; }

button, select, input, textarea {
  border-radius: 8px;
  padding: 8px;
  font-family: inherit;
}

textarea { resize: none; height: 120px; width: 100%; }

.hidden { display: none; }

/* ENVELOPE */
.envelope-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 60px;
}

.envelope {
  width: 260px;
  height: 170px;
  background: #eee;
  position: relative;
  overflow: hidden;
  border-radius: 6px;
}

.flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 50%;
  background: #ddd;
  transform-origin: top;
  transition: 0.8s;
}

.envelope.open .flap { transform: rotateX(180deg); }

.letter-preview {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  transition: 0.8s;
}

.envelope.open .letter-preview {
  transform: translateY(-120%);
  opacity: 0;
}

/* LETTER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.postcard {
  background: #f7f7f7;
  padding: 20px;
  border-radius: 15px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 10px;
}

.dark {
  background: #111;
  color: white;
}

.dark .postcard { background: #1f1f1f; }

@media (max-width: 600px) {
  h1 { font-size: 2em; }
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div class="envelope-wrapper" id="envelopeUI">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="letter-preview">📩 You received a letter</div>
  </div>
  <button id="openLetterBtn">Open Letter</button>
</div>

<!-- LETTER UI -->
<div class="container hidden" id="letterUI">

<h1 id="title">Love Letter</h1>

<div class="controls">
  <select id="format">
    <option value="Love Letter">Love</option>
    <option value="Formal Letter">Formal</option>
    <option value="Informal Letter">Informal</option>
    <option value="Birthday Letter">Birthday</option>
    <option value="Invitation Letter">Invitation</option>
  </select>

  <select id="fontSelect">
    <option value="Quicksand">Quicksand</option>
    <option value="Poppins">Poppins</option>
    <option value="Playfair Display">Playfair</option>
  </select>

  <input type="color" id="textColor">
  <input type="range" min="14" max="28" value="16" id="fontSize">

  <button id="darkBtn">Dark</button>
  <button id="resetBtn">Reset</button>
</div>

<div class="postcard" id="letterBox">
  <p>Date: <span id="date"></span></p>

  <p>Dear <input id="recipient" placeholder="Recipient"></p>
  <textarea id="message" placeholder="Write your message..."></textarea>
  <p>Sincerely,</p>
  <input id="sender" placeholder="(Optional / Anonymous)">
</div>

<div class="controls">
  <input id="email" type="email" placeholder="Recipient Gmail">
  <button id="saveDraft">Save Draft</button>
  <button id="gmailBtn">Gmail Draft</button>
</div>

</div>

<script>
// Envelope animation logic
const envelope = document.getElementById("envelope");
const openBtn = document.getElementById("openLetterBtn");
const envelopeUI = document.getElementById("envelopeUI");
const letterUI = document.getElementById("letterUI");

openBtn.onclick = () => {
  envelope.classList.add("open");
  setTimeout(() => {
    envelopeUI.style.display = "none";
    letterUI.classList.remove("hidden");
  }, 900);
};

// Auto date
document.getElementById("date").innerText =
  new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });

// Elements
const message = document.getElementById("message");
const fontSelect = document.getElementById("fontSelect");
const textColor = document.getElementById("textColor");
const fontSize = document.getElementById("fontSize");
const letterBox = document.getElementById("letterBox");
const recipient = document.getElementById("recipient");
const sender = document.getElementById("sender");
const email = document.getElementById("email");

// Apply styles
fontSelect.onchange = () => letterBox.style.fontFamily = fontSelect.value;
textColor.oninput = () => letterBox.style.color = textColor.value;
fontSize.oninput = () => letterBox.style.fontSize = fontSize.value + "px";

// Format title
document.getElementById("format").onchange = e =>
  document.getElementById("title").innerText = e.target.value;

// Dark mode
document.getElementById("darkBtn").onclick = () =>
  document.body.classList.toggle("dark");

// Reset
document.getElementById("resetBtn").onclick = () => {
  localStorage.clear();
  location.reload();
};

// Save draft
document.getElementById("saveDraft").onclick = () => {
  localStorage.setItem("draft", JSON.stringify({
    r: recipient.value,
    m: message.value,
    s: sender.value,
    f: fontSelect.value,
    c: textColor.value,
    sz: fontSize.value
  }));
  alert("Draft saved!");
};

// Load draft
const saved = JSON.parse(localStorage.getItem("draft"));
if(saved){
  recipient.value = saved.r;
  message.value = saved.m;
  sender.value = saved.s;
  fontSelect.value = saved.f;
  textColor.value = saved.c;
  fontSize.value = saved.sz;
  letterBox.style.fontFamily = saved.f;
  letterBox.style.color = saved.c;
  letterBox.style.fontSize = saved.sz + "px";
}

// Gmail draft
document.getElementById("gmailBtn").onclick = () => {
  const to = email.value;
  const body = encodeURIComponent(
    `Dear ${recipient.value},\n\n${message.value}\n\n${sender.value || "— Anonymous"}`
  );
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&body=${body}`);
};
</script>

</body>
</html>
